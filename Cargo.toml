[package]
name = "gcs-rust-fs"
version = "0.1.2"
edition = "2021"
# Pinned to the MSRV of the google-cloud-storage SDK.
rust-version = "1.91"
description = "Non-POSIX, pure-Rust file-system primitives for Google Cloud Storage built on the official Rust storage SDK."
license = "Apache-2.0"
repository = "https://github.com/raj-prince/gcs-rust-fs"
readme = "README.md"
keywords = ["gcs", "google-cloud-storage", "filesystem", "fsspec", "gcsfs"]
categories = ["filesystem", "api-bindings", "asynchronous"]

[lib]
name = "gcs_rust_fs"
path = "src/lib.rs"

[[bin]]
name = "gcsfs-sidecar"
path = "src/bin/gcsfs_sidecar.rs"

[dependencies]
google-cloud-storage = "1"
# Canonical gRPC status codes (error classification) and the paginator traits.
google-cloud-gax = "1"
# `Poller` for the long-running `RenameFolder` operation on HNS buckets.
google-cloud-lro = "1"
# `FileSystem` / `File` are object-safe async traits (Arc<dyn FileSystem>,
# Box<dyn File>) so the bridge can pick an implementation at runtime.
async-trait = "0.1"
# Bounded concurrency for the derived bulk operations (cat, rm, copy, put).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# `rt` + `sync`: the resumable writer streams bytes through an mpsc channel into
# a spawned upload task; `net` + `signal` + `rt-multi-thread`: sidecar server.
tokio = { version = "1", features = ["macros", "fs", "io-util", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
prost = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
base64 = "0.22"
tracing = "0.1"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
# The storage SDK's appendable-object API (zonal writes) is behind this rustc
# cfg; see .cargo/config.toml.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(google_cloud_unstable_storage_bidi)"] }
